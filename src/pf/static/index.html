<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Later Ledger</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <div class="page">
      <header class="mast">
        <p class="eyebrow">Later Ledger</p>
        <h1>Questions a calculator does not answer</h1>
        <p class="lede">
          Three tools for ordinary money decisions. Each one uses past prices, says what it assumes, and keeps what you type on this computer.
        </p>
        <nav class="tabs" aria-label="Tools">
          <button type="button" id="tab-back" data-tab="back" aria-selected="true">What if I had</button>
          <button type="button" id="tab-ahead" data-tab="ahead">If I keep going</button>
          <button type="button" id="tab-last" data-tab="last">How long it lasts</button>
        </nav>
      </header>
      <div class="layout">
        <form id="controls" class="controls"></form>
        <main class="results" id="results"></main>
      </div>
    </div>
    <script src="/static/app.js?v=8"></script>
  </body>
</html>
